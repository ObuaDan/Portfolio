<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird | obua.is-a.dev</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../../style.css">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: var(--bg);
        }

        body::before {
            background-image: radial-gradient(circle, rgba(255, 255, 255, 0.055) 1px, transparent 1.2px);
            background-size: 14px 14px;
        }

        body {
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .demo-layout {
            width: min(1200px, calc(100% - 56px));
            margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(0, 540px) minmax(0, 1fr);
            gap: 60px;
            align-items: start;
            padding: 40px 0;
        }

        .demo-frame {
            width: 540px;
            height: 960px;
            aspect-ratio: 9 / 16;
            margin: 0 auto;
            transform-origin: top center;
        }

        .demo-frame iframe {
            width: 540px;
            height: 960px;
            display: block;
            border: 0;
            overflow: hidden;
        }

        .demo-breakdown {
            padding: 0;
            border: 0;
        }

        .demo-breakdown h2 {
            font-family: 'Archivo Black';
            font-size: clamp(24px, 4vw, 32px);
            text-transform: uppercase;
            margin: 0 0 16px;
        }

        .demo-breakdown p {
            color: var(--muted);
            font-size: 15px;
            line-height: 1.7;
            max-width: 640px;
            margin-bottom: 40px;
        }

        .demo-breakdown p + p {
            margin-top: 14px;
        }

        @media (max-width: 1000px) {
            .demo-layout {
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                gap: 30px;
            }

            .demo-frame {
                width: 100%;
                height: auto;
                aspect-ratio: 9 / 16;
            }

            .demo-frame iframe {
                width: 100%;
                height: 100%;
            }
        }

        @media (max-width: 700px) {
            .demo-layout {
                width: calc(100% - 32px);
                margin: 0 auto;
                grid-template-columns: 1fr;
                gap: 40px;
                padding: 25px 0 40px;
            }

            .demo-frame {
                width: 100%;
                max-width: 540px;
                height: auto;
                aspect-ratio: 9 / 16;
                margin: 0 auto;
            }

            .demo-frame iframe {
                width: 100%;
                height: 100%;
            }

            .demo-breakdown {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="demos-bar">
        <div class="wrap">
            <div class="brand">
                <a href="../../index.html">
                    <span class="monogreen">home</span>
                </a>
                /
                <a href="../demos-page.html">
                    <span class="monogreen">demos</span>
                </a>
                / FLAPPY BIRD
            </div>
        </div>
    </div>

    <main class="demo-layout">

        <div class="demo-frame">
            <iframe
                src="../../flappy-bird-webgl/index.html"
                title="Flappy Bird WebGL Demo"
                allowfullscreen>
            </iframe>
        </div>

        <section class="demo-breakdown">
            <h2>TECHNICAL BREAKDOWN</h2>

            <p>
                Lorem ipsum dolor sit amet consectetur adipisicing elit.
                Veritatis quas, aliquid beatae esse adipisci quae sit
                similique fugit voluptatibus possimus id nostrum libero
                repudiandae hic numquam voluptatum laborum a cupiditate
                doloribus.
            </p>
        </section>

    </main>

    <script>
        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
                window.location.href = '../demos-page.html';
            }
        });
    </script>

</body>

</html>
