<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Name | obua.is-a.dev</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../style.css">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            height: 100%;
            background: var(--bg);
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .demo-main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 28px;
            min-height: 0;
            margin-top: 50px;
        }

        .demo-frame {
            width: min(960px, 100%);
            max-width: calc(100vw - 20px);
            aspect-ratio: 16 / 10;
            max-height: calc(100vh - 120px);
            display: flex;
        }

        .demo-main iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>

<body>
    <div class="demos-bar">
        <div class="wrap">
            <a class="back-btn" href="../demos-page.html">Back</a>
            <div class="brand">OBUA<span class="monogreen">.is-a.dev</span> / Demos / VOXELS</div>
        </div>
    </div>
    <main class="demo-main">
        <div class="demo-frame">
            <iframe src="../../voxels-webgl/index.html" title="Voxels WebGL Demo" allowfullscreen></iframe>
        </div>
    </main>
    <script>
        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
                window.location.href = '../demos.html';
            }
        });
    </script>
</body>

</html>
