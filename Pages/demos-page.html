<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demos | obua.is-a.dev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <link rel="preload" as="image" href="../Images/voxels.png">
  <style>
    body {
      background: var(--bg);
    }

    body::before {
      background-image: radial-gradient(circle, rgba(255, 255, 255, 0.055) 1px, transparent 1.2px);
      background-size: 14px 14px;
    }

    .demos-page .wrap {
      z-index: 1;
    }
  </style>
</head>

<body class="demos-page">
  <div class="demos-bar">
    <div class="wrap">
      <div class="brand"><a href="../index.html"><span class="monogreen">home</span></a> / Demos</div>
    </div>
  </div>

  <div class="wrap demo-grid-wrap">
    <div class="demo-grid" id="demo-grid">
    </div>
  </div>

  <script>
    async function loadProjects() {
      try {
        const response = await fetch("demos.json");

        if (!response.ok) {
          throw new Error("Could not load projects.json");
        }

        const projects = await response.json();

        const grid = document.getElementById("demo-grid");

        projects.forEach(project => {
          const card = document.createElement("a");
          const isEmpty = project.id === "empty";

          card.className = isEmpty ? "demo-card demo-card--empty" : "demo-card";
          card.href = isEmpty ? "#" : project.page;

          if (project.image) {
            card.style.setProperty("--image", `url('${project.image}')`);
          }

          const tagsHTML = (project.tags || [])
            .map(tag => `<span class="d-tag">${tag}</span>`)
            .join("");

          card.innerHTML = isEmpty
            ? `<div class="demo-card__inner"><h3>${project.title}</h3></div>`
            : `
      <div class="demo-card__image"></div>
      <div class="demo-card__inner">
        <h3>${project.title}</h3>
        ${project.subtitle ? `<p class="d-subtitle">${project.subtitle}</p>` : ""}
        ${tagsHTML ? `<div class="d-tags">${tagsHTML}</div>` : ""}
      </div>
    `;

          grid.appendChild(card);
        });

      } catch (error) {
        console.error("Failed to load projects:", error);
      }
    }

    loadProjects();
  </script>
</body>

</html>
